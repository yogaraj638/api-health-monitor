<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="__REFRESH__">
  <title>API Health Monitor</title>
  <style>
    body  { font-family: Arial, sans-serif; margin: 40px; color: #222; }
    h1    { margin-bottom: 4px; }
    .sub  { color: #777; margin-bottom: 24px; }
    .cards { display: flex; gap: 12px; margin-bottom: 24px; }
    .card { background: #f4f4f4; padding: 12px 20px; border-radius: 8px; }
    .card b { display: block; font-size: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #ddd; }
    .UP    { color: #1a7f37; font-weight: bold; }
    .SLOW  { color: #b58100; font-weight: bold; }
    .ERROR { color: #b58100; font-weight: bold; }
    .DOWN  { color: #c62828; font-weight: bold; }
  </style>
</head>
<body>
  <h1>API Health Monitor</h1>
  <div class="sub">Last check: __CHECKED_AT__ · refreshes every __REFRESH__s</div>

  <div class="cards">
    <div class="card">Up<b class="UP">__UP__</b></div>
    <div class="card">Slow<b class="SLOW">__SLOW__</b></div>
    <div class="card">Error<b class="ERROR">__ERROR__</b></div>
    <div class="card">Down<b class="DOWN">__DOWN__</b></div>
  </div>

  <table>
    <tr><th>Status</th><th>URL</th><th>Code</th><th>Time (ms)</th><th>Reason</th></tr>
__ROWS__
  </table>
</body>
</html>
